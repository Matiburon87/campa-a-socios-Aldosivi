<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./escudo-aldosivi.png" />
    <title>Centro Estratégico de Socios — Club Atlético Aldosivi</title>
    <meta name="theme-color" content="#0f3f22" />
    <meta name="author" content="Maty_Asaro_Dev, Marcos Knudsen" />
    <script>
      // Apply the theme before first paint to avoid a light flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('aldosivi-theme'); } catch (e) {}
        var dark = t ? t === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
